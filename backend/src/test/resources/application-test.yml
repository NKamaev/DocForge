spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/docforge
    username: docforge
    password: docforge
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    mongodb:
      uri: mongodb://docforge:docforge@localhost:27017/docforge?authSource=admin
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

app:
  upload:
    dir: ./uploads/images
  jwt:
    secret: "docforge-super-secret-key-must-be-at-least-256-bits-long-for-HS256"
    expiration-ms: 86400000
  ws:
    allowed-origins: "http://localhost:5173"

logging:
  level:
    com.docforge: INFO
    org.springframework.security: WARN
