spring:
  application:
    name: docforge

  datasource:
    url: jdbc:postgresql://localhost:5432/docforge
    username: docforge
    password: docforge
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    mongodb:
      uri: mongodb://docforge:docforge@localhost:27017/docforge?authSource=admin
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

app:
  upload:
    dir: ./uploads/images
  jwt:
    secret: "docforge-super-secret-key-must-be-at-least-256-bits-long-for-HS256"
    expiration-ms: 86400000   # 24h
  ws:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.docforge: DEBUG
    org.springframework.security: INFO
