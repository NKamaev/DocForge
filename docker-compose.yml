services:
  postgres:
    image: postgres:16-alpine
    container_name: docforge-postgres
    environment:
      POSTGRES_DB: docforge
      POSTGRES_USER: docforge
      POSTGRES_PASSWORD: docforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: docforge-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: docforge
      MONGO_INITDB_ROOT_PASSWORD: docforge
      MONGO_INITDB_DATABASE: docforge
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  redis_data:
