<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocForge — Конструктор документов</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN (с конфигурацией под DocForge oklch) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: 'oklch(0.55 0.16 232)',
            'brand-soft': 'oklch(0.96 0.03 232)',
            ink: {
              1: 'oklch(0.15 0.02 280)',
              2: 'oklch(0.30 0.02 280)',
              3: 'oklch(0.45 0.02 280)',
              4: 'oklch(0.60 0.02 280)',
            },
            bg: 'oklch(0.98 0.005 280)',
            surface: 'oklch(1 0 0)',
            border: 'oklch(0.90 0.01 280)',
          },
          fontFamily: {
            ui: ['"Inter Tight"', 'sans-serif'],
            doc: ['"Source Serif 4"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          borderRadius: {
            'lg': 'var(--r-md, 12px)',
          }
        },
      },
    }
  </script>

  <style>
    body { font-family: theme('fontFamily.ui'); background-color: theme('colors.bg'); color: theme('colors.ink.2'); }
    [data-theme="dark"] { --tw-bg-opacity: 1; --tw-text-opacity: 1; }
    [data-theme="dark"] body { background-color: oklch(0.12 0.01 280); color: oklch(0.95 0.02 280); }
    [data-theme="dark"] .bg-surface { background-color: oklch(0.18 0.01 280) !important; }
    [data-theme="dark"] .border-border { border-color: oklch(0.25 0.01 280) !important; }
    [data-theme="dark"] .text-ink-1 { color: oklch(0.95 0.02 280) !important; }
    [data-theme="dark"] .text-ink-2 { color: oklch(0.80 0.02 280) !important; }
    [data-theme="dark"] .text-ink-3 { color: oklch(0.65 0.02 280) !important; }

    /* shadcn-style base */
    .btn-primary { background-color: theme('colors.brand'); color: white; padding: 6px 16px; border-radius: 6px; font-weight: 500; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background-color: theme('colors.surface'); color: theme('colors.ink.2'); border: 1px solid theme('colors.border'); padding: 6px 16px; border-radius: 6px; font-weight: 500; }
    .btn-ghost { background: transparent; color: theme('colors.ink.3'); padding: 6px 8px; border-radius: 6px; }
    .btn-ghost:hover { background-color: theme('colors.brand-soft'); }

    /* Responsive */
    @media (max-width: 920px) {
      .sidebar { display: none !important; }
      .split-layout { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body class="bg-bg text-ink-2">

  <div class="grid" style="grid-template-columns: 232px 1fr; grid-template-rows: 56px 1fr; min-height: 100vh;">
    <!-- Topbar -->
    <header class="col-span-2 h-[56px] bg-surface border-b border-border flex items-center px-4 gap-2 z-100">
      <div class="flex items-center gap-2 mr-6 font-semibold text-ink-1">
        <div class="w-7 h-7 bg-brand rounded-md flex items-center justify-center text-white text-xs font-bold">D</div>
        DocForge
      </div>
      <nav class="flex gap-1">
        <a class="px-3 py-1.5 rounded-md text-sm font-medium text-brand bg-brand-soft">Главная</a>
        <a class="px-3 py-1.5 rounded-md text-sm font-medium text-ink-3 hover:bg-brand-soft hover:text-brand">Мои документы</a>
        <a class="px-3 py-1.5 rounded-md text-sm font-medium text-ink-3 hover:bg-brand-soft hover:text-brand">Шаблоны</a>
        <a class="px-3 py-1.5 rounded-md text-sm font-medium text-ink-3 hover:bg-brand-soft hover:text-brand">Справочники</a>
      </nav>
      <div class="flex-1"></div>
      <div class="flex items-center gap-1">
        <button class="w-8 h-8 flex items-center justify-center rounded-md text-ink-3 hover:bg-brand-soft">?</button>
        <button class="w-8 h-8 flex items-center justify-center rounded-md text-ink-3 hover:bg-brand-soft">🔔</button>
        <div class="w-8 h-8 rounded-full bg-brand text-white flex items-center justify-center text-xs font-semibold">ИП</div>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="bg-surface border-r border-border p-4 overflow-y-auto">
      <div class="mb-6">
        <div class="text-[0.7rem] font-semibold uppercase tracking-wider text-ink-4 mb-2">Недавние</div>
        <div class="text-sm p-1.5 rounded-md bg-brand-soft text-brand mb-1 cursor-pointer">Договор поставки №123</div>
        <div class="text-sm p-1.5 rounded-md text-ink-2 hover:bg-brand-soft mb-1 cursor-pointer">Приказ о приеме</div>
        <div class="text-sm p-1.5 rounded-md text-ink-2 hover:bg-brand-soft cursor-pointer">Устав ООО</div>
      </div>
      <div class="mb-6">
        <div class="text-[0.7rem] font-semibold uppercase tracking-wider text-ink-4 mb-2">Закладки</div>
        <div class="text-sm p-1.5 rounded-md text-ink-2 hover:bg-brand-soft cursor-pointer">Шаблоны договоров</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="p-6 overflow-y-auto bg-bg" id="content">
      <!-- Сюда вставляются секции из layouts.md -->
      <div class="text-center text-ink-3 py-20">
        Выберите страницу для отображения (Главная / Документы / Шаблоны / Редактор)
      </div>
    </main>
  </div>

</body>
</html>
